name: Update domain blocklist

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: domain-blocklist-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MASSDNS_VERSION: 1.1.0
      DNSX_VERSION: 1.3.0
      DNSX_LINUX_AMD64_SHA256: 1415020474886151a4820c62b9e68a315cc062f7f111a2fd13fda99047a809a6

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"
          python-version: "3.12"
          enable-cache: false

      - name: Sync Python dependencies
        run: uv sync --locked

      - name: Install pinned DNS validators
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          test "$(brew info --json=v2 massdns | jq -r '.formulae[0].versions.stable')" = "$MASSDNS_VERSION"
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install --force-bottle massdns
          test "$(brew list --versions massdns)" = "massdns $MASSDNS_VERSION"
          mkdir -p "$HOME/.local/bin"
          ln -s "$(brew --prefix massdns)/bin/massdns" "$HOME/.local/bin/massdns"

          dnsx_temp="$(mktemp -d)"
          dnsx_archive="dnsx_${DNSX_VERSION}_linux_amd64.zip"
          curl --fail --location --silent --show-error \
            --output "$dnsx_temp/$dnsx_archive" \
            "https://github.com/projectdiscovery/dnsx/releases/download/v${DNSX_VERSION}/${dnsx_archive}"
          echo "${DNSX_LINUX_AMD64_SHA256}  $dnsx_temp/$dnsx_archive" | sha256sum --check
          unzip -q "$dnsx_temp/$dnsx_archive" -d "$dnsx_temp"
          install -m 0755 "$dnsx_temp/dnsx" "$HOME/.local/bin/dnsx"

      - name: Add DNS validators to PATH
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/massdns" --help >/dev/null 2>&1
          "$HOME/.local/bin/dnsx" -version

      - name: Test
        run: uv run --locked python -m unittest discover -s tests -v

      - name: Build
        run: uv run --locked python scripts/build_blocklists.py

      - name: Commit updated lists
        run: |
          if [[ -z "$(git status --porcelain -- output)" ]]; then
            echo "No blocklist changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          git commit -m "chore: update domain blocklist"
          git push
