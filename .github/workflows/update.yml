name: Update domain blocklist

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: domain-blocklist-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MASSDNS_COMMIT: 6bfa47197d78e68b79041d494e280174cb2d6ae1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"
          python-version: "3.12"
          enable-cache: false

      - name: Sync Python dependencies
        run: uv sync --locked

      - name: Build and install pinned MassDNS
        run: |
          massdns_temp="$(mktemp -d)"
          git -C "$massdns_temp" init --quiet
          git -C "$massdns_temp" remote add origin https://github.com/blechschmidt/massdns.git
          git -C "$massdns_temp" fetch --quiet --depth 1 origin "$MASSDNS_COMMIT"
          git -C "$massdns_temp" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$massdns_temp" rev-parse HEAD)" = "$MASSDNS_COMMIT"
          make -C "$massdns_temp" -j2
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$massdns_temp/bin/massdns" "$HOME/.local/bin/massdns"

      - name: Add MassDNS to PATH
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/massdns" --help >/dev/null 2>&1

      - name: Test
        run: uv run --locked python -m unittest discover -s tests -v

      - name: Build
        run: uv run --locked python scripts/build_blocklists.py

      - name: Commit updated lists
        run: |
          if [[ -z "$(git status --porcelain -- output)" ]]; then
            echo "No blocklist changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          git commit -m "chore: update domain blocklist"
          git push
