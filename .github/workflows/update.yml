name: Update domain blocklist

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: domain-blocklist-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"
          python-version: "3.12"
          enable-cache: false

      - name: Sync Python dependencies
        run: uv sync --locked

      - name: Test
        run: uv run --locked python -m unittest discover -s tests -v

      - name: Build
        run: uv run --locked python scripts/build_blocklists.py

      - name: Commit updated lists
        run: |
          if [[ -z "$(git status --porcelain -- output)" ]]; then
            echo "No blocklist changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          git commit -m "chore: update domain blocklist"
          git push
